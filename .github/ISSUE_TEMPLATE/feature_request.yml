name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认文档仓中没有现成方案：https://github.com/jiuhunwl/bugpkapi-new-docs
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与当前阻碍，而不是直接给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 开放 API 网关
        - 接口与计费
        - 支付
        - 用户与权限
        - 风控与审计
        - 内容运营
        - 工单
        - 部署与运维
    validations:
      required: true
