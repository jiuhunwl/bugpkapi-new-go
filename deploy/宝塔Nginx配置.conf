# ================= BugPk-Api 生产 Nginx 配置 =================
# 当前生产站点：api.example.com
# 站点根目录：/www/wwwroot/bugpk_app/frontend/dist
#
# 使用方式：
#   1. 宝塔「网站 -> api.example.com -> 配置文件」中整体替换/合并本配置。
#   2. 若部署目录或域名不同，同步修改 server_name、root、证书和日志路径。
#   3. 保存后执行 nginx -t，再重载 Nginx。
#
# 关键点：
#   - proxy_pass 不带尾斜杠，保留 /system-api、/api 与 /open-api 前缀透传给后端。
#   - 后端默认监听 127.0.0.1:8080；若 .env 的 SERVER_PORT 改变，需同步修改。
#   - /api/{apiCode} 是开放网关，必须使用精确匹配 + ^~ 前缀匹配，不能落入 SPA 回退。
#   - 性能优化（并发优化）：
#       * upstream keepalive 64：让 Nginx 与后端保持连接池，减少每次新建 TCP / accept 压力；
#       * 普通 API location 移除 `Connection "upgrade"`（改为空串），仅 WebSocket 专用
#         location 才设置 Upgrade/Connection upgrade，避免非 WS 请求强制关闭 keep-alive；
#       * proxy_connect_timeout 20s（原 10s）作为推荐底线：防止高峰瞬间 accept 队列满直接 522。
# 验证：修改后执行 nginx -t 通过后 reload；可用 curl 查看响应头确认普通 API 不再返回 upgrade。
# ================================================================
# Direct mode is also supported: keep FRONTEND_SERVE_ENABLED=true and expose
# the Go SERVER_PORT directly. In that mode this Nginx file is optional; if
# Nginx remains in front, proxy the whole site to Go instead of using an
# SPA-only try_files rule for API paths.

# ---------- upstream 池（启用 keep-alive） ----------
upstream bugpk_api_backend {
    server 127.0.0.1:8080;
    # 保持 64 个空闲连接复用，显著降低后端 accept / 新建 TCP 压力
    keepalive 64;
}

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name api.example.com;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/bugpk_app/frontend/dist;
    include /www/server/panel/vhost/nginx/extension/api.example.com/*.conf;

    # CERT-APPLY-CHECK--START
    # 用于 SSL 证书申请时的文件验证相关配置，请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/api.example.com.conf;
    # CERT-APPLY-CHECK--END

    # SSL-START：宝塔证书配置
    #error_page 404/404.html;
    # HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    # HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/api.example.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # HSTS：强制浏览器后续一律走 HTTPS。注意 HSTS 一旦生效不易回退，
    # 首次上线建议先把 max-age 改为较短值（如 300）观察几天，
    # 确认全站均可正常 HTTPS 后再拉长为 31536000；
    # 如确认所有子域均支持 HTTPS，可再追加 ;includeSubDomains（谨慎启用 preload）。
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443"; h3-25=":443"; h3-T050=":443"; h3-Q050=":443"; h3-Q049=":443"; h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    # SSL-END

    # ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    # ERROR-PAGE-END

    # REWRITE-START
    include /www/server/panel/vhost/rewrite/html_api.example.com.conf;
    # REWRITE-END

    # ---------- 后端 API 反向代理（普通 REST/JSON API） ----------
    # 精确匹配 + ^~ 确保接口请求不会被静态资源正则或 SPA 的 index.html 回退接管。
    location = /system-api {
        proxy_pass http://bugpk_api_backend;
        proxy_http_version 1.1;                  # keep-alive 需要 HTTP/1.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 普通 API 不设置 Upgrade / Connection："upgrade" 会禁用 keep-alive。
        # 这里显式清空 Connection，让 Nginx 自行维护 upstream keep-alive。
        proxy_set_header Connection "";
        # connect 20s：防止高峰瞬时 accept 队列满直接 522；真实故障应尽早表现为超时而非挂死
        proxy_connect_timeout 20s;
        proxy_read_timeout   300s;
        proxy_send_timeout   60s;
    }

    location ^~ /system-api/ {
        proxy_pass http://bugpk_api_backend;
        proxy_http_version 1.1;                  # keep-alive 需要 HTTP/1.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 普通 API 移除 “Connection upgrade”，与 keepalive 复用兼容
        proxy_set_header Connection "";
        # 若确有 WebSocket 需求，请在下方单独 location 中保留：
        #   proxy_set_header Upgrade $http_upgrade;
        #   proxy_set_header Connection "upgrade";
        proxy_connect_timeout 20s;
        proxy_read_timeout   300s;
        proxy_send_timeout   60s;
    }

    location = /api {
        proxy_pass http://bugpk_api_backend;
        proxy_http_version 1.1;                  # keep-alive 需要 HTTP/1.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 20s;
        proxy_read_timeout   300s;
        proxy_send_timeout   60s;
    }

    location ^~ /api/ {
        proxy_pass http://bugpk_api_backend;
        proxy_http_version 1.1;                  # keep-alive 需要 HTTP/1.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 20s;
        proxy_read_timeout   300s;
        proxy_send_timeout   60s;
    }

    # 开放账号 API：保留路径，避免命中 SPA 或静态资源正则。
    location = /open-api {
        proxy_pass http://bugpk_api_backend;
        proxy_http_version 1.1;                  # keep-alive 需要 HTTP/1.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 20s;
        proxy_read_timeout   300s;
        proxy_send_timeout   60s;
    }

    location ^~ /open-api/ {
        proxy_pass http://bugpk_api_backend;
        proxy_http_version 1.1;                  # keep-alive 需要 HTTP/1.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 20s;
        proxy_read_timeout   300s;
        proxy_send_timeout   60s;
    }

    # ---------- WebSocket 专用 location（如后续需要 WS 长连接） ----------
    # 示例：/ws/ 路径若后端提供 WebSocket 服务，请单独保留 Upgrade 头：
    # location ^~ /ws/ {
    #     proxy_pass http://bugpk_api_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_connect_timeout 20s;
    #     proxy_read_timeout 3600s;   # WS 长连接读超时可放宽
    #     proxy_send_timeout 60s;
    # }

    # ---------- 静态资源缓存 ----------
    # 只缓存带真实后缀的静态资源，避免把 index.html 缓存 12 小时。
    location ~* \.(js|css|woff2?|ttf|eot|svg|map)$ {
        expires 12h;
        add_header Cache-Control "public, max-age=43200";
        error_log /dev/null;
        access_log /dev/null;
    }
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        error_log /dev/null;
        access_log /dev/null;
    }

    # ---------- SPA 前端路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 一键申请 SSL 证书验证目录
    location ~ \.well-known {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    access_log  /www/wwwlogs/api.example.com.log;
    error_log  /www/wwwlogs/api.example.com.error.log;
}